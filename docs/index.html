<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1117">
<title>Radar TECH history</title>
<style>
:root{--bg:#0f1117;--card:#181b24;--line:#272b38;--tx:#e8eaf0;--mut:#8b91a3;--ac:#7c8cff;--hot:#ff7a59;--ok:#3ecf8e;--bad:#ff5d6c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,23,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px 0}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:18px}
.meta{color:var(--mut);font-size:12px;margin:2px 0 6px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:inherit;font-size:14px;padding:8px 12px;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--tx);border-color:var(--ac);font-weight:600}
main{max-width:860px;margin:0 auto;padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:4px 10px;font-size:12px;text-decoration:none}
.chip.hot{border-color:var(--hot);color:var(--hot)}
button.chip{cursor:pointer;font:inherit;font-size:12px}
button.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:20px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card.mine{border-color:var(--ac)}
.card.done{opacity:.55}
.top{display:flex;gap:10px;align-items:flex-start}
.score{flex:none;background:var(--ac);color:#fff;border-radius:8px;padding:2px 8px;font-weight:700;font-size:13px}
.card h3{margin:0;font-size:16px;line-height:1.35}
.src{color:var(--mut);font-size:12px;margin:4px 0;word-break:break-all}
.why{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.why span{font-size:11px;padding:2px 8px;border-radius:6px;background:#23283a;color:var(--ac)}
.why span.g{background:#3a2320;color:var(--hot)}
.sum{color:#c3c7d4;font-size:14px;margin:6px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{background:#232838;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#04120b;font-weight:600}
.btn.x{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:wait}
details{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--ac);font-size:14px}
pre.text{white-space:pre-wrap;word-wrap:break-word;font:13px/1.55 inherit;background:#12151d;border-radius:10px;padding:12px;max-height:420px;overflow:auto}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:8px}
.gal a{display:block;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:#12151d}
.gal img{width:100%;height:100%;object-fit:cover}
.note{color:var(--mut);font-size:12px;margin:6px 0}
.warn{background:#2a2113;border:1px solid #5a4620;color:#f0c987;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ok);color:#04120b;padding:8px 16px;border-radius:999px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;max-width:92vw;text-align:center;z-index:9}
#toast.on{opacity:1}
#toast.err{background:var(--bad);color:#fff}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.add{display:flex;gap:8px;margin:8px 0}
input[type=text],input[type=password],textarea{width:100%;background:#12151d;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px}
textarea{min-height:60px;resize:vertical}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:14px}
.item .t small{color:var(--mut);font-size:12px;word-break:break-all}
.st-ok{color:var(--ok)}.st-bad{color:var(--bad)}
ol.how{padding-left:20px;font-size:14px;color:#c3c7d4}
ol.how li{margin:4px 0}
label.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>📡 Radar TECH history</h1><button id="upd" class="btn p" data-act="upd">↻ Atualizar</button></div>
  <div class="meta" id="meta">carregando…</div>
  <nav id="tabs"></nav>
</header>
<main><div id="app"><p class="empty">Carregando…</p></div></main>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url = u => /^https?:\/\//i.test(u || "") ? esc(u) : "#";
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d = "") { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

let DATA = null, TAB = "radar", FILTER = "Todas", SOURCES = null, LINKS = [], PAUTA = [];
let SYNC = "local", BUSY = false, REMOTE_ERR = "", pushTimer = null;

const TOKEN = () => store.get("th_token");
function repoSlug() {
  const o = store.get("th_repo").trim();
  if (o) return o;
  const h = location.hostname;
  if (h.endsWith(".github.io")) {
    const rep = location.pathname.split("/")[1];
    if (rep) return h.split(".")[0] + "/" + rep;
  }
  return "";
}
const canWrite = () => !!(TOKEN() && repoSlug());

/* ---------------------------------------------------------------- API do GitHub */
async function gh(path, opt = {}) {
  if (!canWrite()) throw new Error("Configure o token na aba ⚙");
  const r = await fetch("https://api.github.com/repos/" + repoSlug() + path, {
    method: opt.method || "GET",
    cache: "no-store",
    headers: {
      Accept: opt.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
      Authorization: "Bearer " + TOKEN(),
      "X-GitHub-Api-Version": "2022-11-28",
      ...(opt.body ? {"Content-Type": "application/json"} : {}),
    },
    body: opt.body,
  });
  if (r.status === 404 && opt.allow404) return null;
  if (!r.ok) {
    let m = ""; try { m = (await r.json()).message; } catch {}
    const e = new Error(`GitHub ${r.status}: ${m || "erro"}`); e.status = r.status; throw e;
  }
  if (r.status === 204) return null;
  return opt.raw ? r.text() : r.json();
}
const readText = p => gh("/contents/" + p, {raw: true, allow404: true});
async function writeText(path, text, msg) {
  for (let i = 0; i < 2; i++) {
    const dir = path.includes("/") ? path.slice(0, path.lastIndexOf("/")) : "";
    const list = await gh("/contents/" + dir, {allow404: true});
    const hit = Array.isArray(list) ? list.find(f => f.path === path) : null;
    const body = {message: msg, content: btoa(unescape(encodeURIComponent(text)))};
    if (hit) body.sha = hit.sha;
    try { await gh("/contents/" + path, {method: "PUT", body: JSON.stringify(body)}); return; }
    catch (e) { if ((e.status === 409 || e.status === 422) && i === 0) continue; throw e; }
  }
}

/* ---------------------------------------------------------------- utilidades */
function toast(m, ms = 2200, bad = false) {
  const el = $("#toast"); el.textContent = m; el.classList.toggle("err", bad); el.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), ms);
}
async function copy(t) {
  try { await navigator.clipboard.writeText(t); }
  catch { const a = document.createElement("textarea"); a.value = t; document.body.append(a); a.select(); document.execCommand("copy"); a.remove(); }
  toast("Copiado!", 1400);
}
function ago(iso) {
  if (!iso) return "";
  const h = (Date.now() - new Date(iso)) / 36e5;
  if (isNaN(h)) return "";
  return h < 1 ? "agora há pouco" : h < 24 ? `há ${Math.round(h)} h` : `há ${Math.round(h / 24)} d`;
}
const words = t => (t || "").trim().split(/\s+/).filter(Boolean).length;
const kq = s => encodeURIComponent((s.keywords || []).join(" "));
const inPauta = u => PAUTA.some(p => p.url === u);
const findStory = u => PAUTA.find(x => x.url === u) || (DATA?.stories || []).find(x => x.url === u) || (DATA?.manual || []).find(x => x.url === u);

function freeLinks(s) {
  const k = kq(s);
  return [
    ["Pexels (vídeos)", `https://www.pexels.com/search/videos/${k}/`],
    ["Pixabay (vídeos)", `https://pixabay.com/videos/search/${k}/`],
    ["Wikimedia Commons", `https://commons.wikimedia.org/w/index.php?search=${k}&title=Special:MediaSearch&type=image`],
    ["YouTube (Creative Commons)", `https://www.youtube.com/results?search_query=${k}&sp=EgIwAQ%253D%253D`],
    ["NASA", `https://images.nasa.gov/search-results?q=${k}`],
  ].map(([n, u]) => `<a class="chip" target="_blank" rel="noopener" href="${u}">${esc(n)}</a>`).join("");
}

function buildPrompt(s, kind) {
  const fmt = kind === "short" ? "um Short de até 60 segundos (cerca de 150 palavras)" : "um vídeo de 6 a 8 minutos (cerca de 900 a 1100 palavras)";
  const outras = (s.also_in || []).map(a => `${a.source}: ${a.url}`).join("\n");
  return `Você é roteirista do canal brasileiro de tecnologia "TECH history".
Crie o roteiro de ${fmt} sobre a notícia abaixo.

Regras:
- Reescreva tudo com suas próprias palavras e uma narrativa original. Não copie frases da fonte.
- Gancho forte nos primeiros 3 segundos, linguagem simples e direta, tom empolgado mas honesto.
- Inclua análise própria: por que isso importa e o que muda para o brasileiro.
- Não invente números nem fatos que não estejam na fonte.
- Entregue: 3 opções de título, texto de miniatura (máx. 4 palavras), roteiro com marcações [CENA / B-ROLL], descrição e 8 tags.

FONTE PRINCIPAL: ${s.source} - ${s.url}
${outras ? "OUTRAS FONTES:\n" + outras + "\n" : ""}TÍTULO: ${s.title}
${s.note ? "MINHA ANOTAÇÃO: " + s.note + "\n" : ""}${(s.searches || []).length ? "BUSCAS RELACIONADAS NO YOUTUBE: " + s.searches.join(" | ") + "\n" : ""}
TEXTO DA FONTE (apenas para pesquisa):
${(s.text || s.summary || "").slice(0, 6000)}`;
}

/* ---------------------------------------------------------------- pauta (salva no aparelho e, com token, no GitHub) */
function loadLocalPauta() { try { PAUTA = JSON.parse(store.get("th_pauta", "[]")) || []; } catch { PAUTA = []; } }
function savePauta() {
  store.set("th_pauta", JSON.stringify(PAUTA));
  if (canWrite()) { SYNC = "saving"; clearTimeout(pushTimer); pushTimer = setTimeout(pushPauta, 1800); }
  renderTabs(); setSyncNote();
}
async function pushPauta() {
  try { await writeText("data/pauta.json", JSON.stringify(PAUTA, null, 1), "Pauta atualizada"); SYNC = "ok"; }
  catch (e) { SYNC = "err"; REMOTE_ERR = e.message; toast("Não consegui sincronizar: " + e.message, 4500, true); }
  setSyncNote();
}
function syncText() {
  if (!canWrite()) return "Salva só neste aparelho. Para ver a mesma pauta no celular e no PC, configure o token na aba ⚙.";
  return {ok: "✓ Sincronizada entre seus aparelhos", saving: "Sincronizando…", err: "⚠ Falha ao sincronizar: " + REMOTE_ERR, local: "Sincronização pronta"}[SYNC];
}
function setSyncNote() { const el = $("#sync"); if (el) el.textContent = syncText(); }

async function loadRemote() {
  if (!canWrite()) return;
  try {
    const [p, l, c] = await Promise.all([readText("data/pauta.json"), readText("data/links.json"), readText("config.json")]);
    if (p !== null) { PAUTA = JSON.parse(p) || []; store.set("th_pauta", JSON.stringify(PAUTA)); }
    else if (PAUTA.length) pushPauta();
    LINKS = l ? (JSON.parse(l) || []) : [];
    if (c) SOURCES = JSON.parse(c).sources || [];
    if (SYNC !== "err") SYNC = "ok";
  } catch (e) { SYNC = "err"; REMOTE_ERR = e.message; }
  render(true);
}

/* ---------------------------------------------------------------- dados */
async function fetchLatest() {
  if (canWrite()) {
    try { const t = await readText("docs/data/latest.json"); if (t) return JSON.parse(t); } catch {}
  }
  const r = await fetch("data/latest.json?ts=" + Date.now(), {cache: "no-store"});
  if (!r.ok) throw 0;
  return r.json();
}

function setUpd(label) {
  const b = $("#upd"); if (!b) return;
  b.disabled = BUSY; b.textContent = label || "↻ Atualizar";
}
async function runUpdate() {
  if (BUSY) return;
  if (!canWrite()) { TAB = "cfg"; render(); toast("Configure o token para usar o botão Atualizar", 3800, true); return; }
  BUSY = true; setUpd("Iniciando…");
  const t0 = Date.now(), before = DATA?.generated_at;
  try {
    const info = await gh("");
    const w = await gh("/actions/workflows");
    const flows = w.workflows || [];
    const wf = flows.find(x => /coleta/i.test(x.name)) || flows.find(x => /^\.github\/workflows\//.test(x.path) && !/pages/i.test(x.name));
    if (!wf) throw new Error("Workflow de coleta não encontrado");
    await gh(`/actions/workflows/${wf.id}/dispatches`, {method: "POST", body: JSON.stringify({ref: info.default_branch})});
    setUpd("Coletando…");
    let finished = false;
    for (let i = 0; i < 40; i++) {
      await sleep(9000);
      if (!finished) {
        const r = await gh(`/actions/workflows/${wf.id}/runs?event=workflow_dispatch&per_page=1`);
        const run = (r.workflow_runs || [])[0];
        if (run && new Date(run.created_at).getTime() >= t0 - 60000 && run.status === "completed") {
          if (run.conclusion !== "success") throw new Error("A coleta falhou. Veja o erro na aba Actions do GitHub.");
          finished = true; setUpd("Carregando…");
        }
      }
      if (finished) {
        const d = await fetchLatest();
        if (d && d.generated_at !== before) { DATA = d; render(true); toast("Atualizado ✓"); return; }
      }
    }
    throw new Error("Demorou demais. Recarregue a página em 1 minuto.");
  } catch (e) { toast(e.message, 5500, true); }
  finally { BUSY = false; setUpd(); }
}

/* ---------------------------------------------------------------- fontes e links */
function parseSource(input) {
  let u = (input || "").trim(); if (!u) return null;
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  let x; try { x = new URL(u); } catch { return null; }
  const parts = x.hostname.replace(/^www\./, "").split(".");
  let i = parts.length - 2;
  if (["com", "org", "net", "co"].includes(parts[i]) && parts.length >= 3) i--;
  const base = parts[Math.max(0, i)];
  const name = base.charAt(0).toUpperCase() + base.slice(1);
  const isFeed = /(\/feed|\/rss|\.xml|\.rss|atom)/i.test(x.pathname + x.search);
  return isFeed ? {name, feed: x.href} : {name, site: x.href};
}
async function saveSources(list) {
  const cur = JSON.parse((await readText("config.json")) || "{}");
  cur.sources = list;
  await writeText("config.json", JSON.stringify(cur, null, 2) + "\n", "Fontes atualizadas pelo painel");
  SOURCES = list;
}
async function addSource() {
  const el = $("#srcIn"); const s = parseSource(el.value);
  if (!s) return toast("Cole o link de um site ou de um feed RSS", 3000, true);
  const list = (SOURCES || []).slice();
  if (list.some(x => (x.feed || x.site) === (s.feed || s.site))) return toast("Esse link já está na lista", 2500, true);
  if (list.some(x => x.name === s.name)) s.name = s.name + " 2";
  try { await saveSources([...list, s]); el.value = ""; toast("Fonte adicionada. Clique em Atualizar para usar.", 3500); render(true); }
  catch (e) { toast(e.message, 5000, true); }
}
async function delSource(i) {
  const list = (SOURCES || []).slice(); const s = list[i]; if (!s) return;
  if (list.length <= 1) return toast("Mantenha pelo menos 1 fonte", 3000, true);
  if (!confirm(`Remover ${s.name} da busca?`)) return;
  list.splice(i, 1);
  try { await saveSources(list); toast("Fonte removida", 2000); render(true); } catch (e) { toast(e.message, 5000, true); }
}
async function saveLinks(list) {
  await writeText("data/links.json", JSON.stringify(list, null, 1), "Links atualizados pelo painel");
  LINKS = list;
}
async function addLink() {
  const el = $("#linkIn"); let u = el.value.trim();
  if (!u) return;
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  try { new URL(u); } catch { return toast("Link inválido", 2500, true); }
  if (LINKS.some(l => l.url === u)) return toast("Esse link já está na lista", 2500, true);
  try { await saveLinks([...LINKS, {url: u, added: new Date().toISOString()}]); el.value = ""; toast("Link salvo. Clique em Atualizar para lê-lo.", 3500); render(true); }
  catch (e) { toast(e.message, 5000, true); }
}
async function delLink(i) {
  const list = LINKS.slice(); list.splice(i, 1);
  try { await saveLinks(list); toast("Link removido", 2000); render(true); } catch (e) { toast(e.message, 5000, true); }
}

/* ---------------------------------------------------------------- telas */
function card(s, mode) {
  const srcLabel = {firecrawl: "texto completo (Firecrawl)", rss: "texto do feed", basic: "texto extraído (grátis)", none: "sem texto extraído"}[s.text_source] || "";
  const u = esc(s.url), mine = inPauta(s.url), p = mode === "pauta";
  return `<article class="card ${s.manual ? "mine" : ""} ${p && s.done ? "done" : ""}">
    <div class="top"><span class="score">${s.manual ? "🔗" : Number(s.score || 0).toFixed(1)}</span>
      <div><h3>${esc(s.title)}</h3>
      <div class="src">${esc(s.source)} · ${ago(s.published)}${s.also_in?.length ? " · também em " + esc(s.also_in.map(a => a.source).join(", ")) : ""}</div></div></div>
    <div class="why">${(s.why || []).map(w => `<span class="${w.startsWith("Em alta") ? "g" : ""}">${esc(w)}</span>`).join("")}</div>
    ${p ? "" : `<div class="sum">${esc(s.summary)}</div>`}
    <div class="row">
      ${p ? `<button class="btn x" data-act="pauta" data-u="${u}">✕ Tirar da pauta</button>`
          : `<button class="btn ${mine ? "ok" : ""}" data-act="pauta" data-u="${u}">${mine ? "✓ Na pauta" : "＋ Pauta"}</button>`}
      <a class="btn" target="_blank" rel="noopener" href="${url(s.url)}">Abrir original</a>
      <button class="btn p" data-act="prompt" data-u="${u}" data-k="short">Roteiro Short</button>
      <button class="btn p" data-act="prompt" data-u="${u}" data-k="long">Roteiro vídeo</button>
    </div>
    ${p ? `<textarea data-note="${u}" placeholder="Minha anotação (ângulo do vídeo, título, ideias…)">${esc(s.note || "")}</textarea>
      <label class="chk"><input type="checkbox" data-done="${u}" ${s.done ? "checked" : ""}> Já gravei este vídeo</label>` : ""}
    ${(s.searches || []).length ? `<div class="note">Buscas relacionadas no YouTube:</div><div class="chips">${s.searches.map(x => `<a class="chip" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(x)}">${esc(x)}</a>`).join("")}</div>` : ""}
    <details><summary>Texto da fonte (${words(s.text)} palavras · ${srcLabel})</summary>
      <div class="row"><button class="btn" data-act="copytext" data-u="${u}">Copiar texto</button></div>
      <pre class="text">${esc(s.text || "Não foi possível extrair o texto. Abra o original.")}</pre>
    </details>
    <details><summary>Fotos e vídeos (${(s.images || []).length} fotos · ${(s.videos || []).length} vídeos)</summary>
      ${(s.videos || []).length ? `<div class="chips">${s.videos.map((v, n) => `<a class="chip" target="_blank" rel="noopener" href="${url(v)}">▶ vídeo ${n + 1}</a>`).join("")}</div>` : ""}
      ${(s.images || []).length ? `<div class="gal">${s.images.map(m => `<a target="_blank" rel="noopener" href="${url(m)}"><img loading="lazy" referrerpolicy="no-referrer" src="${url(m)}" alt=""></a>`).join("")}</div>` : ""}
      <p class="note">⚠ Fotos e vídeos da fonte têm direitos autorais. Use só com permissão/licença ou prefira os bancos gratuitos abaixo.</p>
      <div class="chips">${freeLinks(s)}</div>
    </details>
  </article>`;
}

function viewRadar() {
  if (!DATA) return '<p class="empty">Ainda não há dados.<br>Toque em <b>Atualizar</b> ou rode a coleta em <b>Actions</b> no GitHub.</p>';
  const d = DATA, u = d.usage || {};
  const names = ["Todas", ...new Set(d.stories.map(s => s.source))];
  const list = d.stories.filter(s => FILTER === "Todas" || s.source === FILTER);
  const pct = u.month_limit ? Math.min(100, 100 * u.used / u.month_limit) : 0;
  return `
    ${(d.manual || []).length ? `<h2>🔗 Meus links</h2>${d.manual.map(s => card(s)).join("")}` : ""}
    ${d.trends?.length ? `<h2>🔥 Em alta no Google Brasil</h2><div class="chips">${d.trends.map(t => `<a class="chip hot" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(t.term)}">${esc(t.term)}</a>`).join("")}</div>` : ""}
    <h2>Fonte</h2>
    <div class="chips">${names.map(n => `<button class="chip ${n === FILTER ? "on" : ""}" data-act="filter" data-v="${esc(n)}">${esc(n)}</button>`).join("")}</div>
    ${list.map(s => card(s)).join("") || '<p class="empty">Nada nesta fonte.</p>'}
    <h2>Créditos Firecrawl</h2>
    <div class="note">Mês: ${u.used ?? 0} de ${u.month_limit ?? 0} · Hoje: ${u.used_today ?? 0} (limite diário ${u.daily_allowance ?? 0})</div>
    <div class="bar"><i style="width:${pct}%"></i></div>`;
}

function viewPauta() {
  const items = PAUTA.slice().sort((a, b) => (b.added || 0) - (a.added || 0));
  return `<div class="note" id="sync">${esc(syncText())}</div>
    ${items.length ? `<div class="row"><button class="btn" data-act="copylist">Copiar lista (títulos + links)</button></div>` : ""}
    ${items.map(s => card(s, "pauta")).join("") || '<p class="empty">Sua pauta está vazia.<br>Toque em <b>＋ Pauta</b> nas notícias que vai usar nos vídeos.</p>'}`;
}

function viewFontes() {
  const w = canWrite();
  const srcs = SOURCES || (DATA?.sources || []).map(s => ({name: s.name, feed: s.feed}));
  const st = Object.fromEntries((DATA?.sources || []).map(s => [s.name, s]));
  return `
    ${w ? "" : `<div class="warn">Para adicionar ou remover sites e links, configure o token na aba <b>⚙</b>. Por enquanto você só pode ver a lista.</div>`}
    <h2>Sites que o app monitora</h2>
    ${srcs.map((s, i) => { const t = st[s.name];
      const status = t ? (t.ok ? `<span class="st-ok">✓ ${t.count} notícias nas últimas 48h</span>` : `<span class="st-bad">✕ não consegui ler o feed</span>`) : "nova · aguardando a próxima coleta";
      return `<div class="item"><div class="t"><b>${esc(s.name)}</b><small>${esc(s.feed || s.site || "")}</small><br><small>${status}</small></div>${w ? `<button class="btn x" data-act="srcdel" data-n="${i}">✕</button>` : ""}</div>`; }).join("")}
    ${w ? `<div class="add"><input type="text" id="srcIn" placeholder="Cole o link do site (ex.: https://olhardigital.com.br)"><button class="btn p" data-act="srcadd">Adicionar</button></div>
    <div class="note">Pode colar o link do site ou do feed RSS. O app tenta achar o feed sozinho.</div>` : ""}
    <h2>Notícias que eu quero (links avulsos)</h2>
    ${LINKS.map((l, i) => `<div class="item"><div class="t"><b>${esc(new URL(l.url, location.href).hostname.replace(/^www\./, ""))}</b><small>${esc(l.url)}</small></div>${w ? `<button class="btn x" data-act="linkdel" data-n="${i}">✕</button>` : ""}</div>`).join("") || '<p class="note">Nenhum link ainda.</p>'}
    ${w ? `<div class="add"><input type="text" id="linkIn" placeholder="Cole o link de uma notícia específica"><button class="btn p" data-act="linkadd">Adicionar</button></div>
    <div class="note">Depois de adicionar, clique em <b>Atualizar</b>: o app lê o texto, fotos e vídeos e mostra no topo de Pautas, em “Meus links”.</div>` : ""}`;
}

function viewCfg() {
  const has = !!TOKEN();
  return `<h2>Conexão com o GitHub</h2>
    <p class="note">Precisa só uma vez em cada aparelho. Ela libera os botões <b>Atualizar</b>, adicionar/remover fontes e a pauta sincronizada. O token fica salvo apenas neste navegador.</p>
    <ol class="how">
      <li>No GitHub, abra <b>Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token</b>.</li>
      <li>Em <b>Repository access</b>, escolha <b>Only select repositories</b> e marque só este repositório.</li>
      <li>Em <b>Permissions → Repository permissions</b>, coloque <b>Contents: Read and write</b> e <b>Actions: Read and write</b>.</li>
      <li>Gere o token, copie e cole abaixo.</li>
    </ol>
    <div class="warn">Nunca coloque o token dentro dos arquivos do repositório nem o compartilhe. Quem tiver o token pode alterar este repositório.</div>
    <label class="note">Repositório (detectado automaticamente)</label>
    <input type="text" id="repoIn" value="${esc(repoSlug())}" placeholder="usuario/repositorio">
    <label class="note">Token ${has ? "(já salvo neste aparelho)" : ""}</label>
    <input type="password" id="tokIn" placeholder="${has ? "•••••••• (deixe vazio para manter)" : "github_pat_…"}" autocomplete="off">
    <div class="row"><button class="btn p" data-act="toksave">Salvar</button><button class="btn" data-act="toktest">Testar conexão</button>${has ? '<button class="btn x" data-act="tokclear">Remover token</button>' : ""}</div>`;
}

function renderTabs() {
  const tabs = [["radar", "Pautas"], ["pauta", `Minha pauta${PAUTA.length ? " (" + PAUTA.length + ")" : ""}`], ["fontes", "Fontes"], ["cfg", "⚙ Conexão"]];
  $("#tabs").innerHTML = tabs.map(([k, n]) => `<button class="${k === TAB ? "on" : ""}" data-act="tab" data-v="${k}">${esc(n)}</button>`).join("");
}
function renderMeta() {
  if (!DATA) { $("#meta").textContent = "sem dados"; return; }
  const when = new Date(DATA.generated_at).toLocaleString("pt-BR", {dateStyle: "short", timeStyle: "short"});
  $("#meta").textContent = `Atualizado ${when} · ${DATA.stories.length} pautas`;
}
function render(keepScroll) {
  const y = window.scrollY;
  renderTabs(); renderMeta();
  $("#app").innerHTML = {radar: viewRadar, pauta: viewPauta, fontes: viewFontes, cfg: viewCfg}[TAB]();
  window.scrollTo(0, keepScroll ? y : 0);
}

/* ---------------------------------------------------------------- eventos */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, s = b.dataset.u ? findStory(b.dataset.u) : null;
  if (act === "tab") { TAB = b.dataset.v; render(); }
  else if (act === "filter") { FILTER = b.dataset.v; render(true); }
  else if (act === "upd") runUpdate();
  else if (act === "copytext") copy(s?.text || "");
  else if (act === "prompt") s && copy(buildPrompt(s, b.dataset.k));
  else if (act === "pauta" && s) {
    if (inPauta(s.url)) PAUTA = PAUTA.filter(p => p.url !== s.url);
    else PAUTA.push({...s, added: Date.now(), note: "", done: false});
    savePauta();
    if (TAB === "pauta") render(true);
    else { const on = inPauta(s.url); b.textContent = on ? "✓ Na pauta" : "＋ Pauta"; b.classList.toggle("ok", on); }
  }
  else if (act === "copylist") copy(PAUTA.map((p, i) => `${i + 1}. ${p.title}\n${p.url}`).join("\n\n"));
  else if (act === "srcadd") addSource();
  else if (act === "srcdel") delSource(+b.dataset.n);
  else if (act === "linkadd") addLink();
  else if (act === "linkdel") delLink(+b.dataset.n);
  else if (act === "toksave") {
    const t = $("#tokIn").value.trim(), r = $("#repoIn").value.trim();
    if (t) store.set("th_token", t);
    if (r && r !== repoSlug()) store.set("th_repo", r);
    toast("Salvo neste aparelho"); await loadRemote(); render();
  }
  else if (act === "toktest") {
    const t = $("#tokIn").value.trim(), r = $("#repoIn").value.trim();
    if (t) store.set("th_token", t);
    if (r) store.set("th_repo", r);
    try {
      const info = await gh("");
      toast(info.permissions?.push ? `Conectado a ${info.full_name} ✓` : "Conectou, mas o token não tem permissão de escrita (Contents)", 4500, !info.permissions?.push);
    } catch (err) { toast(err.message, 5000, true); }
  }
  else if (act === "tokclear") { store.del("th_token"); SOURCES = null; LINKS = []; SYNC = "local"; toast("Token removido deste aparelho"); render(); }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "srcIn") addSource();
  if (e.target.id === "linkIn") addLink();
});
document.addEventListener("input", e => {
  const u = e.target.dataset?.note; if (u === undefined) return;
  const p = PAUTA.find(x => x.url === u); if (!p) return;
  p.note = e.target.value; clearTimeout(input.t); input.t = setTimeout(savePauta, 600);
});
function input() {}
document.addEventListener("change", e => {
  const u = e.target.dataset?.done; if (u === undefined) return;
  const p = PAUTA.find(x => x.url === u); if (!p) return;
  p.done = e.target.checked; savePauta(); e.target.closest(".card")?.classList.toggle("done", p.done);
});

/* ---------------------------------------------------------------- início */
loadLocalPauta();
render();
fetchLatest().then(d => { DATA = d; render(); }).catch(() => { DATA = null; render(); });
loadRemote();
</script>
</body>
</html>
