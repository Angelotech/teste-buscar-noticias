name: Coleta diária

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC = 06:00 em Brasília
  workflow_dispatch:        # permite rodar manualmente (botão Atualizar do site, ou Actions)

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar noticias
        run: python scripts/collect.py
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      - name: Salvar resultado
        run: |
          git config user.name "techhistory-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "coleta $(date -u +%F)" && git pull --rebase origin main && git push)
